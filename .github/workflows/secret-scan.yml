name: Secret Scan

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

# 防止真实 API Key / Token / Cookie 误提交
# 命中模式（通用形状检测，不嵌入任何真实凭证前缀）：
#   1. sk- 开头 + 16 位以上字母数字（DashScope / OpenAI 类 key）
#   2. TUSHARE_TOKEN= 后面跟 20+ 位 hex（避免漏掉真实 token）
#   3. 东方财富 cookie 字段 st_pvi / st_psi / qgqp_b_id
#   4. 内联 mysql://user:password@host 形式的 DSN
jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Scan staged diff for hardcoded secrets
          env:
            # 仅在 PR 上检查本次新增的内容；push 时检查整个工作区
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
          run: |
            set -euo pipefail
            PATTERN='(sk-[a-zA-Z0-9]{16,}|qgqp_b_id=|st_pvi=|st_psi=|TUSHARE_TOKEN=[a-f0-9]{20,}|mysql\+pymysql://[^:]+:[^@]+@)'
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
              echo "🔍 仅检查 PR diff（vs ${BASE_SHA}）"
              git fetch origin "${BASE_SHA}" --depth=1
              FILES=$(git diff --name-only "${BASE_SHA}"...HEAD || true)
              FOUND=0
              for f in $FILES; do
                if git show "HEAD:${f}" 2>/dev/null | grep -E "${PATTERN}" >/dev/null; then
                  echo "❌ ${f} 命中凭证模式"
                  FOUND=1
                fi
              done
              if [ "$FOUND" -ne 0 ]; then
                echo "::error::检测到可能的真实凭证，请检查并替换为 .env 占位符"
                exit 1
              fi
            else
              echo "🔍 扫描整个工作区"
              if grep -rEn "${PATTERN}" \
                  --include='*.py' --include='*.sh' --include='*.js' --include='*.ts' \
                  --include='*.vue' --include='*.json' --include='*.yml' --include='*.yaml' \
                  --include='*.toml' --include='*.md' --include='*.example' \
                  --exclude-dir='.venv' --exclude-dir='node_modules' \
                  --exclude-dir='.git' --exclude-dir='mlruns' \
                  --exclude-dir='skills' \
                  . ; then
                echo "::error::检测到可能的真实凭证，请检查并替换为 .env 占位符"
                exit 1
              fi
            fi
            echo "✅ 未发现硬编码凭证"

        - name: Verify .env is gitignored
          run: |
            if ! git check-ignore .env >/dev/null; then
              echo "::error::.env 必须被 .gitignore 忽略，请修复"
              exit 1
            fi
            echo "✅ .env 已正确忽略"